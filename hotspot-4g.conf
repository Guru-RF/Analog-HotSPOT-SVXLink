# hotspot-4g config
APN="globaldata.iot"
IP_TYPE="4"         # 4 or 6
AUTH=""             # "", PAP, CHAP, BOTH
APN_USER=""         # optional
APN_PASS=""         # optional (plaintext!)

# Bias the modem's network selection. Comma-separated MCCMNC,access_tech
# pairs in priority order — see `qmicli --nas-set-preferred-networks`.
# Useful when a roaming partner is forbidden but the modem keeps camping
# on its strong signal anyway (Belgian example: BASE 20620 is forbidden
# for many Always Connected SIMs, so prefer Orange BE + Proximus).
# Leave empty for fully-automatic selection.
# Example: PREFERRED_NETWORKS="20610,eutran,20601,eutran"
PREFERRED_NETWORKS=""

# hotspot-4g-monitor config
MONITOR_TARGETS="1.1.1.1 8.8.8.8"
MONITOR_INTERVAL=60      # seconds between probes
MONITOR_FAILS=3          # consecutive fails before restarting the link
MONITOR_GRACE=180        # pause after a restart before probing again
MONITOR_PING_TIMEOUT=5   # per-probe timeout in seconds
